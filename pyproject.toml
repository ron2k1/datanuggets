[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "datanuggets"
version = "0.1.0.dev0"
description = "Native Python port of the R packages datanugget and WCluster (data nuggets for large-data reduction)."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-2.0-only"
authors = [{ name = "Ronil Basu" }]
dependencies = [
    "numpy>=2.0",
    "joblib>=1.4",
    "scipy>=1.13",
    "numba>=0.67",
    "numba>=0.68; python_version >= '3.15'",
]

[project.optional-dependencies]
frame = ["pandas>=2.2"]
progress = ["tqdm>=4.66"]
plot = ["matplotlib>=3.9"]

[dependency-groups]
dev = ["pytest>=8", "pytest-xdist>=3.6", "ruff>=0.6", "pandas>=2.2", "tqdm>=4.66", "matplotlib>=3.9"]

[tool.hatch.build.targets.wheel]
packages = ["src/datanuggets"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not slow'"
markers = ["slow: the long long-double fuzz, 10,000,000 cases per operation (pytest -m slow)"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts", "benchmarks"]
extend-exclude = ["docs"]  # prose with illustrative snippets, not sources
