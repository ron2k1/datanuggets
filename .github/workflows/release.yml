# Publishes the sdist and wheel that package.yml built and checked, once the Linux, Windows and
# macOS tests pass. Run by hand, it uploads to TestPyPI; a pushed v* tag uploads to PyPI. Both
# use Trusted Publishing, so no token is stored: the index trusts this file run from the named
# GitHub environment. docs/releasing.md has the one-time setup and the steps.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
  matrix:
    uses: ./.github/workflows/matrix.yml
  package:
    uses: ./.github/workflows/package.yml

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: [tests, matrix, package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: testpypi
      url: https://test.pypi.org/p/datanuggets
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [tests, matrix, package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/datanuggets
    # a job's permissions replace the workflow's, so contents: read is needed again for checkout
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # the files about to go up, checked again, and v0.1.0 refused unless they're 0.1.0
      - name: The tag is v and the built version
        run: python3 scripts/check_dist.py dist --expect-version "${GITHUB_REF_NAME#v}"
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
