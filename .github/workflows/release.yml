# Publishes the sdist and wheel that package.yml built and checked, once the Linux, Windows and
# macOS tests pass and the source-provenance hold is resolved. Manual check runs remain available.
# Both indexes use Trusted Publishing, so no token is stored: the index trusts this file from the named
# GitHub environment. docs/releasing.md has the one-time setup and the steps.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      destination:
        description: Check the candidate only, or publish it to TestPyPI
        type: choice
        required: true
        default: check
        options:
          - check
          - testpypi

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # The commit must be on main, and a tag must match the version in pyproject.toml.
  # Configure environment restrictions and reviewers before enabling publication.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: On main, and the tag is the version
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA isn't on main"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
            if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
              echo "::error::the tag is $GITHUB_REF_NAME, and pyproject.toml says $version"
              exit 1
            fi
          fi

      # Remove this hold only with a reviewed resolution recorded in THIRD_PARTY.md.
      - name: Require resolved source provenance before publication
        if: github.event_name != 'workflow_dispatch' || inputs.destination != 'check'
        run: |
          echo "::error::Publication is on hold: GNU sorting-helper provenance must be resolved. See THIRD_PARTY.md."
          exit 1

  tests:
    needs: gate
    uses: ./.github/workflows/tests.yml
  matrix:
    needs: gate
    uses: ./.github/workflows/matrix.yml
  package:
    needs: gate
    uses: ./.github/workflows/package.yml

  testpypi:
    if: github.event_name == 'workflow_dispatch' && inputs.destination == 'testpypi'
    needs: [tests, matrix, package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: testpypi
      url: https://test.pypi.org/p/datanuggets
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [tests, matrix, package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/datanuggets
    # a job's permissions replace the workflow's, so contents: read is needed again for checkout
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # the files about to go up, checked again, and v0.1.0 refused unless they're 0.1.0
      - name: The tag is v and the built version
        run: python3 scripts/check_dist.py dist --expect-version "${GITHUB_REF_NAME#v}"
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
