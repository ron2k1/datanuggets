# Times WCluster's Whclust and Wkmeans in R and the port on x86 Linux, compares every output bit
# for bit and checks the speed gates, as benchmarks/wcluster.R and benchmarks/wcluster.py do on
# the laptop. x86 R keeps its long double sums in 80 bits, as the laptop's R does, so unlike on
# the mini the bits can be checked here, once R is on the reference BLAS the laptop's R uses.
# A run takes about an hour, mostly R's whclust800, so it
# runs only when a pull request gets the "bench" label, or by hand once this file is on main.
name: bench

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  COVTYPE_URL: https://archive.ics.uci.edu/ml/machine-learning-databases/covtype/covtype.data.gz
  COVTYPE_SHA256: 614360d0257557dd1792834a85a1cdebfadc3c4f30b011d56afee7ffb5b15771

jobs:
  bench:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'bench'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: "4.6.1"
          Ncpus: "2"
      # WCluster's wss sums through %*%, so R's WWCSS and heights depend on its BLAS in the last
      # bits. The runner's R comes on OpenBLAS, which moved 1 to 6 ulp of them against the
      # laptop's reference BLAS with the same merges and labels, so switch before R runs
      - name: R on the reference BLAS and LAPACK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libblas3 liblapack3
          sudo update-alternatives --set libblas.so.3-x86_64-linux-gnu /usr/lib/x86_64-linux-gnu/blas/libblas.so.3
          sudo update-alternatives --set liblapack.so.3-x86_64-linux-gnu /usr/lib/x86_64-linux-gnu/lapack/liblapack.so.3
      - name: Cache the R library
        id: rlib
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/datanuggets-rlib
          key: rlib-${{ runner.os }}-r4.6.1-${{ hashFiles('r/setup.R') }}
      - name: Install datanugget 1.5.0 and WCluster 1.3.0
        if: steps.rlib.outputs.cache-hit != 'true'
        run: Rscript r/setup.R
      - name: R's build, BLAS and long double size
        run: |
          Rscript -e 'source("r/fixture_io.R"); str(versions()); cat("sizeof long double:", .Machine$sizeof.longdouble, "\n")' | tee r-info.txt
          grep -q '/blas/libblas.so.3' r-info.txt || { echo "R isn't on the reference BLAS"; exit 1; }
      - name: Cache Covertype
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/covertype/covtype.data.gz
          key: covtype-${{ env.COVTYPE_SHA256 }}
      - name: Covertype
        run: |
          mkdir -p tmp/covertype
          [ -f tmp/covertype/covtype.data.gz ] || curl -fsSL --retry 3 -o tmp/covertype/covtype.data.gz "$COVTYPE_URL"
          echo "$COVTYPE_SHA256  tmp/covertype/covtype.data.gz" | sha256sum -c -
      - name: R's create.DN on 100,000 Covertype rows, the dn_whclust nuggets
        run: Rscript benchmarks/covertype.R 100000 noshape
      - name: R's Whclust and Wkmeans on quakes
        run: |
          for w in whclust200 whclust400 wkmeans whclust800; do
            Rscript benchmarks/wcluster.R "$w"
          done
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - name: The port, its bits and the gates
        run: uv run python benchmarks/wcluster.py 2>&1 | tee bench.txt
      - name: Summary
        if: always()
        run: |
          {
            echo '```'
            cat r-info.txt bench.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-${{ github.run_id }}
          path: |
            r-info.txt
            bench.txt
            tmp/wcluster/out/
          if-no-files-found: warn
