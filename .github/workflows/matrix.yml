# The default tier on Windows and macOS, on every Python the package claims. tests.yml runs x86
# Linux. This runs on every pull request to main, on a manual dispatch from the Actions tab and
# inside every release.
name: matrix

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# github.workflow is the caller's name when release.yml calls this, so a run of its own on the
# same ref can't cancel a release's
concurrency:
  group: matrix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - name: Default tier
        run: uv run pytest -q -p no:cacheprovider -n 2 -m "not slow"
